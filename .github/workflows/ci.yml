name: Mesa prototype checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run preserved Mesa example
        run: python src/boltzmann_wealth_model/run_model.py

      - name: Run project baseline and alternative experiments
        run: python src/project_model/run_experiments.py

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: del02-model-outputs
          path: outputs/
